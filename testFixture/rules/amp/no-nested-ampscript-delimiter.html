<!DOCTYPE html>
<html>
<body>

<!-- Rule: sfmc/amp-no-nested-ampscript-delimiter
     Flags open-bracket or inline-expression AMPscript delimiters that are
     nested inside an already-open AMPscript block. -->

<!-- ACCEPTED - a script block with no nested delimiters -->
<script language="ampscript" runat="server">
VAR @name
SET @name = "Jane"
</script>

<!-- ACCEPTED - personalisation strings next to an equals sign or an opening
     square bracket are plain text, not delimiters; the inline expression after
     them is a region of its own.
     Secondary diagnostics: sfmc/amp-no-ambiguous-personalization-delimiter
     warns about both strings on purpose; that is unavoidable for this case. -->
<a href="https://example.com/?e=%%emailaddr%%=1">%%First Name%%[x]</a>
<p>%%=Lowercase("HELLO")=%%</p>

<!-- FAIL - an open-bracket delimiter nested inside the script block -->
<script language="ampscript" runat="server">
VAR @a
%%[ SET @a = "nested" ]%%
</script>

</body>
</html>
